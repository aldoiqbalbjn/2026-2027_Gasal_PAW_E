<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proses Data</title>
</head>
<body>
<fieldset>
    <legend>Person Details</legend>
    <form name = "myform" action="prosesdata.php" method="GET">
        <div class="field">
            <label for="surname">Surname</label>
            <input type="text" name="surname" size="31">
        </div>
        <div class="field">
            <label for="email">Email address</label>
            <input type="text" name="email" size="31">
        </div>
        <div class="field">
            <label for="passowrd">Password</label>
            <input type="password" name="password" size="31">
        </div>
        <div class="field">
            <label for="address">Street address</label> 
            <textarea name="address" rows="3" cols="22"></textarea>
        </div>
        <div class="field">
            <label for="state">State</label>
            <select name="state" id="">
                <option value="-1" selected>[choose your state]</option>
                <option value="1" selected>Australian Capital Territory</option>
                <option value="2" selected>Queensland</option>
                <option value="3" selected>Victorial</option>
                <option value="4" selected>New South Wales</option>
                <option value="5" selected>Tasmania</option>
                <option value="6" selected>South Australia</option>
                <option value="7" selected>Western Australia</option>
                <option value="8" selected>Nortern Territory</option>
            </select>
        </div>
        <div class="field">
            <input type="hidden" name="country" value="Australia">
        </div>
        <div class="field">
            <label for="sex">Gender</label>
            <input type="radio" name="sex" value="male">Male
            <input type="radio" name="sex" value="female">female
        </div>
        <div class="field">
            <label for="vegetarian">Vegetarian</label>
            <input type="checkbox" name="vegetarian">
        </div>
        <div class="field">
            <label>&nbsp;</label>
            <input type="submit" value="Submit" name="submit"><input type="reset" name="reset" value="Reset">
        </div>
    </form>
</fieldset>
</body>
</html>
